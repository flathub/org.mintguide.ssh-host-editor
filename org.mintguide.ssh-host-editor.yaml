app-id: org.mintguide.ssh-host-editor
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: run_main.sh
rename-icon: ssh_512
finish-args:
  - --filesystem=home
  - --socket=fallback-x11
  - --share=ipc
  - --socket=wayland
  - --device=dri
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
modules:
  - pypi-dependencies.json

  - name: ssh-host-editor
    buildsystem: simple
    build-commands:
      - mkdir -p /app/ssh-host-editor/
      - install -Dm644 src/*.py -t /app/ssh-host-editor
      - cp -r src/icons/ /app/ssh-host-editor/
      - install -Dm644 src/icons/ssh_512.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm755 src/flatpak/run_main.sh -t /app/bin/
      - install -Dm644 src/flatpak/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 src/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://gitflic.ru/project/shekin/ssh-host-editor.git
        commit: 6e6718f8cbbdc6efa8f2d60a0edbbfbd274c97c5
